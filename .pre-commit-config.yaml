# Pre-commit hooks: the same checks as the Claude Code hooks, but at `git commit` time for any
# editor. A developer not using Claude Code still gets caught here, and CI is the final net.
#
# Install once per clone:  pipx install pre-commit && pre-commit install
# Run on all files:        pre-commit run --all-files
#
# This complements (does not replace) the CI workflow in ci/security-privacy.yml. CI is the
# gate that cannot be skipped; pre-commit is the fast local feedback that mirrors it.

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
        # SEC-SECRET-01/02: hardcoded credentials and credential files.

  - repo: https://github.com/semgrep/semgrep
    rev: v1.78.0
    hooks:
      - id: semgrep
        name: semgrep (org security + privacy rules)
        args:
          - "--config=ci/semgrep/security.yml"
          - "--config=ci/semgrep/privacy.yml"
          - "--error"
          - "--skip-unknown-extensions"

  - repo: local
    hooks:
      - id: block-credential-files
        name: block credential files (SEC-SECRET-02)
        entry: ci/check-credential-files.sh
        language: script
        pass_filenames: true

      - id: workflow-hardening
        name: workflow hardening (SEC-CI-01/02)
        # Reports and never blocks: the `|| true` is what makes that true, because pre-commit
        # blocks on any non-zero exit and there is no report-only setting. A commit is
        # recoverable and pinning a backlog of actions is real work, so the release gate is
        # where this rule earns the right to stop something. `verbose: true` is needed as well,
        # or a passing hook's output is hidden and the report nobody sees is worth nothing.
        entry: bash -c 'ci/check-workflow-hardening.sh "$@" || true' --
        language: system
        # Only the workflow files, so editing anything else costs nothing.
        files: ^\.github/workflows/.*\.(yml|yaml)$
        pass_filenames: true
        verbose: true
