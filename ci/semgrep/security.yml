# Org security rules for semgrep, anchored to security-standards.md rule IDs. These are the
# cross-file / AST checks that the single-file shell hooks cannot do reliably. They run in CI
# and pre-commit. The curated registry packs (p/owasp-top-ten, p/secrets, p/python, ...) cover
# the long tail; these are the company-specific, ID-anchored rules.

rules:
  - id: SEC-INJ-01-python-sql-fstring
    languages: [python]
    severity: ERROR
    message: >
      SEC-INJ-01: SQL built with an f-string or .format() lets untrusted input change the query.
      Use a parameterized query (cursor.execute(sql, params)). See security-standards.md.
    patterns:
      - pattern-either:
          - pattern: $CUR.execute(f"...", ...)
          - pattern: $CUR.execute("...".format(...), ...)
          - pattern: $CUR.executemany(f"...", ...)

  - id: SEC-INJ-02-python-shell-true
    languages: [python]
    severity: ERROR
    message: >
      SEC-INJ-02: subprocess with shell=True on dynamic input allows command injection.
      Pass an argument vector and shell=False. See security-standards.md.
    patterns:
      - pattern-either:
          - pattern: subprocess.run(..., shell=True, ...)
          - pattern: subprocess.call(..., shell=True, ...)
          - pattern: subprocess.Popen(..., shell=True, ...)
          - pattern: os.system(...)

  - id: SEC-CRYPTO-01-python-tls-verify-off
    languages: [python]
    severity: ERROR
    message: >
      SEC-CRYPTO-01: TLS verification disabled (verify=False). This silently accepts any
      certificate. Remove it or pin a CA bundle. See security-standards.md.
    pattern-either:
      - pattern: requests.$M(..., verify=False, ...)
      - pattern: httpx.$M(..., verify=False, ...)

  - id: SEC-WEB-01-js-innerhtml
    languages: [javascript, typescript]
    severity: WARNING
    message: >
      SEC-WEB-01: assigning untrusted data to innerHTML enables DOM XSS. Use textContent or a
      sanitizer (DOMPurify). See security-standards.md.
    pattern-either:
      - pattern: $EL.innerHTML = $X
      - pattern: $EL.insertAdjacentHTML(...)

  - id: SEC-INJ-02-js-eval
    languages: [javascript, typescript]
    severity: ERROR
    message: >
      SEC-INJ-02: eval / new Function on dynamic input is code injection. Remove it.
      See security-standards.md.
    pattern-either:
      - pattern: eval(...)
      - pattern: new Function(...)

  - id: SEC-INJ-03-java-deserialization
    languages: [java]
    severity: ERROR
    message: >
      SEC-INJ-03: native deserialization of untrusted bytes (readObject / XMLDecoder) enables
      RCE. Use a safe format (JSON with a typed mapper). See security-standards.md.
    pattern-either:
      - pattern: (ObjectInputStream $O).readObject()
      - pattern: new XMLDecoder(...)

  - id: SEC-INJ-01-java-statement-concat
    languages: [java]
    severity: ERROR
    message: >
      SEC-INJ-01: SQL via Statement with string concatenation is injectable. Use a
      PreparedStatement with bind parameters. See security-standards.md.
    patterns:
      - pattern: $STMT.executeQuery("..." + $X)

  # Only the switches measured to bypass a check. `algorithms=["none"]` is NOT here: on PyJWT
  # 1.7.1, 2.0.1 and 2.13.0 it raises against a tampered token and against an alg-none token
  # with any key, so flagging it would be a false positive. The legacy `verify=False` argument
  # has its own rule below, because what it does depends on the major version.
  - id: SEC-AUTH-03-python-jwt-verification-off
    languages: [python]
    severity: ERROR
    message: >
      SEC-AUTH-03: a token check is switched off in the options dict, so the token is being
      read rather than verified. Remove the option, pass the key, and pin the algorithms you
      accept. See security-standards.md.
    pattern-either:
      - pattern: 'jwt.decode(..., options={..., "verify_signature": False, ...}, ...)'
      - pattern: 'jwt.decode(..., options={..., "verify_aud": False, ...}, ...)'
      - pattern: 'jwt.decode(..., options={..., "verify_exp": False, ...}, ...)'
      - pattern: 'jwt.decode(..., options={..., "verify_iss": False, ...}, ...)'
      - pattern: 'jwt.decode_complete(..., options={..., "verify_signature": False, ...}, ...)'
      - pattern: 'jwt.decode_complete(..., options={..., "verify_aud": False, ...}, ...)'
      - pattern: 'jwt.decode_complete(..., options={..., "verify_exp": False, ...}, ...)'
      - pattern: 'jwt.decode_complete(..., options={..., "verify_iss": False, ...}, ...)'

  # Measured on PyJWT 1.7.1: `verify=False` ACCEPTS a tampered token, a full signature bypass.
  # On 2.x the argument is ignored and the signature is still checked, so there it is dead
  # code that reads like a bypass. It goes either way, and this pack cannot see which major a
  # consumer pins (djangorestframework-jwt 1.11 still pins PyJWT below 2.0). A rule of its own
  # so the message can say both halves; SEC-AUTH-03 stays in the id for the test's sake.
  - id: SEC-AUTH-03-python-jwt-legacy-verify-false
    languages: [python]
    severity: ERROR
    message: >
      SEC-AUTH-03: the legacy verify=False argument. On PyJWT 1.x it switches the signature
      check off entirely; on 2.x it is ignored and only reads like a bypass. Remove it either
      way, pass the key, and pin the algorithms you accept. See security-standards.md.
    pattern: jwt.decode(..., verify=False, ...)

  # $JWT is constrained: unconstrained, it matched any object with a .verify method, so an
  # unrelated archive.verify(blob, key, {algorithms: ["none"]}) was reported as a token bug.
  # The algorithm list is matched positionally-free, because ["RS256", "none"] is the shape
  # that actually ships and an exact ["none"] missed it. One pattern covers both quote styles:
  # semgrep matches a string literal regardless of its quotes, measured by a single-quoted
  # fixture case that the double-quoted pattern reports, so a second pattern for 'none' was
  # dead code and a mutation run showed it could be deleted unnoticed.
  - id: SEC-AUTH-03-js-jwt-verification-off
    languages: [javascript, typescript]
    severity: ERROR
    message: >
      SEC-AUTH-03: a token check is switched off. Measured on jsonwebtoken 9.0.3, an accepted
      "none" algorithm is refused while a real key is passed and accepts an attacker-minted
      unsigned token the moment the key is empty, null or undefined, so listing it is safe only
      by accident. ignoreExpiration accepts a token that has expired. See security-standards.md.
    patterns:
      - pattern-either:
          - pattern: '$JWT.verify($T, $K, {..., algorithms: [..., "none", ...], ...}, ...)'
          - pattern: '$JWT.verify($T, $K, {..., ignoreExpiration: true, ...}, ...)'
      - metavariable-regex:
          metavariable: $JWT
          regex: (?i).*(jwt|jsonwebtoken|token).*

  # SEC-API-02, mass assignment: a write whose field list the client chooses.
  - id: SEC-API-02-python-all-fields
    languages: [python]
    severity: ERROR
    message: >
      SEC-API-02: fields = "__all__" includes every eligible model field, so a field added to
      the model later becomes reachable through this form or serializer, writable unless it is
      marked read-only or not editable, without anybody listing it. List the fields explicitly.
      See security-standards.md.
    patterns:
      - pattern-either:
          - pattern-inside: |
              class $C(..., $B, ...):
                ...
                class Meta:
                  ...
          - pattern-inside: |
              class $C(..., $M.$B, ...):
                ...
                class Meta:
                  ...
      - metavariable-regex:
          metavariable: $B
          regex: ^(ModelSerializer|HyperlinkedModelSerializer|ModelForm)$
      - pattern-inside: |
          class Meta:
            ...
      - pattern-not-inside: |
          class $C2(..., ModelSerializer, ...):
            ...
            class $H:
              ...
              class Meta:
                ...
      - pattern-not-inside: |
          class $C2(..., $MOD.ModelSerializer, ...):
            ...
            class $H:
              ...
              class Meta:
                ...
      - pattern-not-inside: |
          class $C2(..., HyperlinkedModelSerializer, ...):
            ...
            class $H:
              ...
              class Meta:
                ...
      - pattern-not-inside: |
          class $C2(..., $MOD.HyperlinkedModelSerializer, ...):
            ...
            class $H:
              ...
              class Meta:
                ...
      - pattern-not-inside: |
          class $C2(..., ModelForm, ...):
            ...
            class $H:
              ...
              class Meta:
                ...
      - pattern-not-inside: |
          class $C2(..., $MOD.ModelForm, ...):
            ...
            class $H:
              ...
              class Meta:
                ...
      - pattern-not-inside: |
          def $FN(...):
            ...
      - pattern: fields = "__all__"

  - id: SEC-API-02-python-orm-request-unpacked
    languages: [python]
    severity: ERROR
    message: >
      SEC-API-02: request data goes straight into a model manager call, so the client decides
      which fields are written. Pass the allowed fields by name. See security-standards.md.
    patterns:
      - pattern-either:
          - pattern: $RECV.$METHOD(..., **request.$A, ...)
          - pattern: $RECV.$METHOD(..., **request.$F(...), ...)
          - pattern: $RECV.$METHOD(..., **request.$A.$F(...), ...)
          - pattern: $RECV.$METHOD(..., defaults=request.$A, ...)
          - pattern: $RECV.$METHOD(..., defaults=request.$F(...), ...)
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(create|update|get_or_create|update_or_create)$
      - metavariable-regex:
          metavariable: $RECV
          regex: ^.*\.objects(\.|$)

  - id: SEC-API-02-python-constructor-request-unpacked
    languages: [python]
    severity: ERROR
    message: >
      SEC-API-02: request data is unpacked into a class constructor, so the client's keys become
      its attributes. Pass the allowed fields by name. See security-standards.md.
    patterns:
      - pattern-either:
          - pattern: $CLS(..., **request.$A, ...)
          - pattern: $CLS(..., **request.$F(...), ...)
          - pattern: $CLS(..., **request.$A.$F(...), ...)
      - metavariable-regex:
          metavariable: $CLS
          regex: ^(?![\w.]*(Response|Error|Exception|Dict|Counter|ChainMap|Namespace|Tuple)$)([a-z_][A-Za-z0-9_]*\.)*[A-Z][A-Za-z0-9_]*$

  - id: SEC-API-02-python-setattr-loop
    languages: [python]
    severity: ERROR
    message: >
      SEC-API-02: every key in the request is copied onto the object, so the client decides which
      attributes change. Loop over an allowlist of writable fields instead. See
      security-standards.md.
    pattern-either:
      - pattern: |
          for $K, $V in request.$A.items():
            ...
            setattr($O, $K, $V)
      - pattern: |
          for $K, $V in request.$F(...).items():
            ...
            setattr($O, $K, $V)

  - id: SEC-API-02-js-model-write
    languages: [javascript, typescript]
    severity: ERROR
    message: >
      SEC-API-02: the whole request body goes into a model write, so the client decides which
      fields are written. Pick the allowed fields from the body first, or pass a fields list of
      string literals where the ORM takes one. See security-standards.md.
    patterns:
      - pattern-either:
          - pattern: $M.$WRITE($REQ.body)
          - pattern: $M.$WRITE({..., ...$REQ.body, ...})
          - patterns:
              - pattern: $M.$WRITE($REQ.body, $OPT)
              - metavariable-regex:
                  metavariable: $OPT
                  regex: ^(?![\s\S]*\bfields\s*:\s*\[\s*(?:(?:"[^"]*"|'[^']*')\s*,?\s*)*\])[\s\S]*$
      - metavariable-regex:
          metavariable: $WRITE
          regex: ^(create|insertMany|bulkCreate|build|update)$
      - metavariable-regex:
          metavariable: $M
          regex: ^(?!(Object|Array|Promise|Reflect|JSON|Math|Map|Set|WeakMap|WeakSet|Date|Number|String|Symbol|Proxy)$)([A-Za-z_$][A-Za-z0-9_$]*\.)*[A-Z][A-Za-z0-9_$]*$
      - metavariable-regex:
          metavariable: $REQ
          regex: ^(req|request|ctx\.request)$

  - id: SEC-API-02-js-model-update-by-filter
    languages: [javascript, typescript]
    severity: ERROR
    message: >
      SEC-API-02: the whole request body is the update document, so the client decides which
      fields change. Build the update from the allowed fields. See security-standards.md.
    patterns:
      - pattern: $M.$UPD($Q, $REQ.body, ...)
      - metavariable-regex:
          metavariable: $UPD
          regex: ^(findByIdAndUpdate|findOneAndUpdate|updateOne|updateMany)$
      - metavariable-regex:
          metavariable: $M
          regex: ^([A-Za-z_$][A-Za-z0-9_$]*\.)*[A-Z][A-Za-z0-9_$]*$
      - metavariable-regex:
          metavariable: $REQ
          regex: ^(req|request|ctx\.request)$

  - id: SEC-API-02-js-model-constructor
    languages: [javascript, typescript]
    severity: ERROR
    message: >
      SEC-API-02: a model is constructed from the whole request body, so the client decides which
      fields it holds when it is saved. Pass the allowed fields. See security-standards.md.
    patterns:
      - pattern: new $M($REQ.body)
      - metavariable-regex:
          metavariable: $M
          regex: ^(?!(URLSearchParams|URL|RegExp|Function|Map|Set|WeakMap|WeakSet|Date|Blob|File|Response|Request|Headers|FormData|Buffer|Promise|Proxy|Array|Object|String|Number|Boolean|Symbol|BigInt|ArrayBuffer|SharedArrayBuffer|DataView|Uint8Array|Uint8ClampedArray|Int8Array|Uint16Array|Int16Array|Uint32Array|Int32Array|Float32Array|Float64Array|BigInt64Array|BigUint64Array|TextEncoder|TextDecoder|Event|CustomEvent|MessageEvent|Worker|WebSocket|EventSource|AbortController|ReadableStream|WritableStream|TransformStream|DOMParser|Image|Audio|Notification)$|.*Error$)[A-Z][A-Za-z0-9_$]*$
      - metavariable-regex:
          metavariable: $REQ
          regex: ^(req|request|ctx\.request)$

  - id: SEC-API-02-js-document-assigned-then-saved
    languages: [javascript, typescript]
    severity: ERROR
    message: >
      SEC-API-02: the whole request body is copied onto a document that is then saved, so the
      client decides which fields change. Copy the allowed fields only. See security-standards.md.
    patterns:
      - pattern-either:
          - pattern-inside: |
              Object.assign($O, $REQ.body);
              ...
              $O.save(...);
          - pattern-inside: |
              $O.set($REQ.body);
              ...
              $O.save(...);
      - pattern-not-inside: |
          Object.assign($O, $REQ.body);
          ...
          $O = $X;
          ...
          $O.save(...);
      - pattern-not-inside: |
          $O.set($REQ.body);
          ...
          $O = $X;
          ...
          $O.save(...);
      - pattern-either:
          - pattern: Object.assign($O, $REQ.body)
          - pattern: $O.set($REQ.body)
      - metavariable-regex:
          metavariable: $REQ
          regex: ^(req|request|ctx\.request)$

  - id: SEC-API-02-js-document-assigned-and-saved-chained
    languages: [javascript, typescript]
    severity: ERROR
    message: >
      SEC-API-02: the whole request body is copied onto a document and saved in one expression, so
      the client decides which fields change. Copy the allowed fields only. See
      security-standards.md.
    patterns:
      - pattern-either:
          - pattern: Object.assign($O, $REQ.body).save(...)
          - pattern: $O.set($REQ.body).save(...)
      - metavariable-regex:
          metavariable: $REQ
          regex: ^(req|request|ctx\.request)$

  - id: SEC-API-02-js-prisma-data
    languages: [javascript, typescript]
    severity: ERROR
    message: >
      SEC-API-02: the whole request body is the data of a Prisma write, so the client decides which
      fields are written. Build the data object from the allowed fields. See
      security-standards.md.
    patterns:
      - pattern: '$P.$T.$PW({..., data: $REQ.body, ...})'
      - metavariable-regex:
          metavariable: $PW
          regex: ^(create|update|createMany|updateMany)$
      - metavariable-regex:
          metavariable: $REQ
          regex: ^(req|request|ctx\.request)$

  - id: SEC-API-02-js-prisma-upsert
    languages: [javascript, typescript]
    severity: ERROR
    message: >
      SEC-API-02: the whole request body is one half of a Prisma upsert, so the client decides which
      fields are written. Build that half from the allowed fields. See security-standards.md.
    patterns:
      - pattern-either:
          - pattern: '$P.$T.upsert({..., create: $REQ.body, ...})'
          - pattern: '$P.$T.upsert({..., update: $REQ.body, ...})'
      - metavariable-regex:
          metavariable: $REQ
          regex: ^(req|request|ctx\.request)$
